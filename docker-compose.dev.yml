services:
  moonbase-studio-web:
    image: moonbase/moonbase-studio-web:dev
    build:
      target: dev
    environment:
      - ENVIRONMENT=development
      - PORT=3000
      - HOST=0.0.0.0
      - CORE_LAYER_PATH=./moonbase-core
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    env_file:
      - .env.dev
    volumes:
      - .:/app
      - /app/.nuxt
      - node_modules:/app/node_modules
      - ../moonbase-core:/app/moonbase-core
      - /app/moonbase-core/node_modules
    command:
      - sh
      - -lc
      - >-
        if [ -f /app/moonbase-core/package.json ]; then
          cd /app/moonbase-core && pnpm install;
        fi;
        cd /app && pnpm dev
    tty: true
    stdin_open: true

volumes:
  node_modules:
